[package]
name = "sla-checker"
version = "0.1.0"
edition = "2021"

[dependencies]
sla-ast = { path = "../sla-ast" }

# Only the parse->check end-to-end tests (tests_e2e.rs) consume the
# parser; the checker library itself does not depend on it in
